name: TalentOne Playwright CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build Application and Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      MONGODB_URI: mongodb://127.0.0.1:27017/talentone_qa
      JWT_SECRET: ci-only-dummy-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:5000
      NEXT_TELEMETRY_DISABLED: 1
      DISABLE_EMAILS: "true"
      DISABLE_FILE_UPLOADS: "true"

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Private TalentOne Application
        uses: actions/checkout@v4
        with:
          repository: Shrihari25-hub/talentone-hr-platform
          ref: main
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Application Dependencies
        working-directory: app
        run: npm ci

      - name: Build TalentOne Application
        working-directory: app
        run: npm run build

      - name: Install Automation Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talentone-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn
